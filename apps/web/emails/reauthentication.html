<!doctype html>
<!-- Supabase Auth → Emails → Templates → "Reauthentication"
     Subject: Your OneMetric verification code
     Variable: {{ .Token }}  (a one-time code, NOT a URL) -->
<html>
  <body style="margin:0;padding:0;background-color:#0a0a0a;font-family:Arial,Helvetica,sans-serif;">
    <span style="display:none;max-height:0;overflow:hidden;opacity:0;">Your OneMetric verification code.</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#141414;border:1px solid #262626;border-radius:12px;">
            <tr>
              <td style="padding:36px 36px 8px 36px;">
                <p style="margin:0;color:#a1a1aa;font-size:12px;letter-spacing:2px;text-transform:uppercase;">OneMetric</p>
                <h1 style="margin:14px 0 0 0;color:#fafafa;font-size:24px;font-weight:600;">Your verification code</h1>
                <p style="margin:14px 0 0 0;color:#d4d4d8;font-size:15px;line-height:1.6;">
                  Enter this code to confirm it's you. It expires shortly — don't share it with anyone.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 36px 8px 36px;">
                <div style="background-color:#0a0a0a;border:1px solid #262626;border-radius:8px;padding:18px;text-align:center;">
                  <span style="font-family:'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#fafafa;">{{ .Token }}</span>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 36px 36px 36px;">
                <p style="margin:0;color:#52525b;font-size:12px;">If you didn't request this code, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
          <p style="margin:20px 0 0 0;color:#52525b;font-size:12px;">© OneMetric · Cookieless analytics</p>
        </td>
      </tr>
    </table>
  </body>
</html>
