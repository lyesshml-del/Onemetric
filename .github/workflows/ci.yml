name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Dummy values so prisma generate / next build / vitest run without real services.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      VISITOR_HASH_SALT: "ci-salt"
      CREDENTIALS_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      CRON_SECRET: "ci-cron-secret"
      REPORT_FROM_EMAIL: "OneMetric <ci@example.com>"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace @onemetric/web

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
